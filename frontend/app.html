<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent workspace — Aditya AI</title><link rel="stylesheet" href="/app/css/style.css"></head>
<body class="workspace"><nav class="nav workspace-nav"><a class="brand" href="/"><span class="brand-mark">✦</span><span>ADITYA AI <small>VOICE ENTERPRISE</small></span></a><div class="workspace-links"><span>Businesses</span><span class="active">Appointments</span><span>Settings</span><button class="theme-toggle" onclick="toggleTheme()">◐</button></div></nav>
<main class="dashboard container"><header class="dash-header"><div><p class="eyebrow">OPERATIONS / LIVE DEMO</p><h1>Appointment command center</h1></div><div class="select-wrap"><label>BUSINESS</label><select id="business-select"></select></div></header><section class="metrics" id="metrics"></section><div class="dash-grid"><aside class="panel business-panel"><div class="panel-heading"><h2>Businesses</h2><span id="business-count"></span></div><input id="business-search" placeholder="⌕  Search businesses"><div id="business-list"></div></aside><section class="center-column"><div class="panel agent-panel"><div class="panel-heading"><div><h2>AI Appointment Agent</h2><p id="agent-context">Ready to help</p></div><span class="agent-status"><i></i> ONLINE</span></div><div id="chat" class="chat"><div class="message ai"><span class="avatar">✦</span><div><small>ADITYA AI</small><p>Hello! I’m ready to help. Try “Book a dental cleaning tomorrow at 4 PM.”</p></div></div></div><div class="quick-actions"><button onclick="quickMessage('Check availability tomorrow')">Check availability</button><button onclick="quickMessage('Book an appointment tomorrow at 4 PM')">Book appointment</button><button onclick="quickMessage('Cancel my appointment')">Cancel</button></div><form id="chat-form" class="chat-form"><input id="message-input" placeholder="Ask anything about appointments..." autocomplete="off"><button type="button" id="mic-button" title="Use voice">●</button><button class="send" type="submit">Send ↗</button></form></div></section><aside class="right-column"><div class="panel calendar-panel"><div class="panel-heading"><h2>Availability</h2><input type="date" id="date-picker"></div><div id="slots" class="slots"></div></div><div class="panel appointments-panel"><div class="panel-heading"><h2>Recent activity</h2><button class="refresh" onclick="loadAppointments()">↻</button></div><div id="appointments"></div></div></aside></div></main><div id="toast"></div><script src="/app/js/app.js"></script><script src="/app/js/dashboard.js"></script></body></html>
